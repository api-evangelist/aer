docs: https://consumerdatastandardsaustralia.github.io/standards/#cdr-energy-api
summary: >-
  The AER's public data model is a single entity — the energy plan — in two
  projections. The summary projection (EnergyPlan) is what Get Generic Plans returns;
  the full projection (EnergyPlanDetailV3) embeds the summary plus the whole contract
  tree. There are no cross-entity foreign keys and no consumer entities: accounts,
  service points, usage and customers exist in the specification but not on this host.
identifiers:
- field: planId
  entity: EnergyPlan
  format: >-
    Opaque retailer-assigned string. Observed values carry a retailer prefix and an
    @EME suffix, e.g. AGL1067320MRE2@EME. The AER states plan values are permanently
    fixed and that a revised plan appears either as an incremented trailing version
    digit or as an entirely new planId.
  stable: true
- field: brand
  entity: EnergyPlan
  format: >-
    Lowercase retailer brand key that also serves as the base-URI path segment (agl,
    origin, energyaustralia, ...). Resolve it from the ACCC CDR Register
    productBaseUri rather than hard-coding.
entities:
- name: EnergyPlan
  role: summary projection
  returned_by: [listEnergyPlans]
  observed_fields: [type, brand, planId, fuelType, brandName, geography, displayName, lastUpdated, customerType, effectiveFrom]
  note: geography carries distributors[], includedPostcodes[] and optionally excludedPostcodes[].
- name: EnergyPlanDetailV3
