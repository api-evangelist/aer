optional_fields:
  detail: >-
    The AER states optional fields are retailer discretion — excluded postcodes,
    controlled load, demand charges, discounts and additional information may be absent
    from a valid plan. Controlled load applies to electricity only. Banded daily supply
    charges appear only on selected Queensland plans. Demand charges apply only to
    electricity customers with smart meters. Consumers must therefore treat absence as
    "not offered", not as "missing data".
  source: https://www.aer.gov.au/energy-product-reference-data
not_present_on_this_host:
  entities: [EnergyAccount, EnergyBalance, EnergyInvoice, EnergyBilling, EnergyConcession, EnergyPaymentSchedule, EnergyServicePoint, EnergyUsageRead, EnergyDerRecord, CommonCustomer]
  reason: >-
    Consumer-side entities held by retailers (primary data holders) and AEMO (secondary
    data holder). Their paths return 404 on the AER host.
