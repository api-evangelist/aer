  provider_notice_url: https://www.aer.gov.au/energy-product-reference-data
  sunset_header: false
  detail: >-
    The deprecation policy is genuinely published, and it is stronger than most
    commercial APIs manage — just not by the AER. The Data Standards Body maintains a
    per-endpoint, per-version Endpoint Version Schedule with four dates for every
    version: date introduced (and the standards release that introduced it), binding
    date, date deprecated, and retirement date. Every energy data holder including the
    AER is held to it, and the AER republishes the transitions that affect it under
    "Supported API Versions" on its own documentation page. There is no RFC 8594
    Sunset or Deprecation response header on this host — a retired version simply
    stops being accepted and returns HTTP 406
    urn:au-cds:error:cds-all:Header/UnsupportedVersion.
