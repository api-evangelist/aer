not_implemented_by_this_holder:
  detail: >-
    16 of the 18 paths in the harvested CDR Energy API specification are consumer-data
    endpoints held by retailers and by AEMO as secondary data holder. They return 404
    on the AER host. This is architecture, not deprecation.
  paths:
  - /energy/accounts and all children (balance, billing, invoices, concessions, payment-schedule)
  - /energy/electricity/servicepoints and all children (usage, der)
