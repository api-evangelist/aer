status_page:
  type: machine-readable-endpoint
  url: https://cdr.energymadeeasy.gov.au/agl/cds-au/v1/discovery/status
  outages_url: https://cdr.energymadeeasy.gov.au/agl/cds-au/v1/discovery/outages
  verified: '2026-07-27'
  detail: >-
    The AER serves the Consumer Data Standards Common API discovery endpoints
    anonymously. GET /discovery/status with x-v 1 returned HTTP 200 with
    {"data":{"status":"OK","updateTime":"..."}}, and GET /discovery/outages returned
    {"data":{"outages":[]}}. This is a real status surface — an API, not an HTML
    status page — and it is the correct thing to poll before raising a support
    ticket. Both are versioned at x-v 1 and both are brand-scoped: they must be called
    under a brand path segment (the unbranded /cds-au/v1/discovery/status returns
    404). Observed quirk on 2026-07-27: the outages response echoed
    links.self pointing at a different brand path (/1st-energy/) than the one
    requested, so treat links.self on that endpoint as unreliable.
  status_schema: openapi/cds-common-api-openapi.json#getStatus
  outages_schema: openapi/cds-common-api-openapi.json#getOutages
