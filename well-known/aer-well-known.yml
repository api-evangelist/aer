method: searched
source: live probes of the AER website host and the CDR product-data host
note: >-
  www.aer.gov.au is fronted by Akamai and returns no HTTP response to direct curl
  from this probe host (TLS completes, then the connection times out with 0 bytes).
  Documents on that host were therefore retrieved through the r.jina.ai text proxy,
  which passes the origin status through; they are marked via_text_proxy: true and
  should be read as origin statuses observed indirectly. Probes against
  cdr.energymadeeasy.gov.au and www.energymadeeasy.gov.au were direct.
