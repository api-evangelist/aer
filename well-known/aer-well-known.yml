machine_readable_discovery:
  note: >-
    The AER publishes no /.well-known discovery surface on its API host. Discovery of
    the AER's product-data endpoints happens instead through two real, anonymous,
    machine-readable surfaces recorded elsewhere in this repo — the ACCC CDR Register
    brand summary (which resolves 79 of 84 energy brands to this host) and the
    Consumer Data Standards Common API discovery endpoints served on the AER host.
  cdr_register: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
  status_endpoint: https://cdr.energymadeeasy.gov.au/{brand}/cds-au/v1/discovery/status
  outages_endpoint: https://cdr.energymadeeasy.gov.au/{brand}/cds-au/v1/discovery/outages
