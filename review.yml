actions:
  apisYmlCreated: true
  apisListed: 2
  openapiDirectory: openapi/ — one specification, harvested verbatim, DSB-authored
  reason: |
    Two APIs are listed because the AER documents exactly two operations and both
    were called successfully and anonymously. Nothing was invented: no consumer-data
    endpoint, no wholesale data API, and no AER-authored specification is claimed.
    The private Energy Made Easy backend at api.energymadeeasy.gov.au (HTTP 403) was
    deliberately NOT listed as an API because it is undocumented and inaccessible.
