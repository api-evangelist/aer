findings:
  developerPortal: https://www.aer.gov.au/energy-product-reference-data
  developerPortalConfirmed: true
  developerPortalNote: |
    Confirmed as a real, self-serve public documentation surface, not a customer
    login. It is a documentation PAGE on the main Drupal site rather than a developer
    portal product — there is no console, no key management, no interactive try-it,
    no changelog feed and no SDKs — but it names the operations, the supported
    versions, the required headers, the paging limits and the support mailbox, and
    the endpoints it documents answer anonymously. Origin status observed as 200 via
    text proxy because Akamai blocked direct access from this probe host.
  openapiHarvested: true
  specsCount: 1
  apisListed: 2
  regulatorPublishesBetterThanIndustry: true
  regulatorNote: |
    Yes, and here it is not a figure of speech. This series keeps finding regulators
    out-publishing the industry they supervise; the AER is the extreme version — it
    does not merely publish better than the retailers, it publishes FOR them. 79 of
    84 registered energy data-holder brands do not operate a product API at all; the
    ACCC register points third parties at the AER's own host. The AER also
    out-publishes its sibling institutions: AEMC (the rule maker) ships nothing
    machine-readable, while the AER ships a live, standards-conformant, anonymously
    callable API covering the entire NECF retail market.
  caveats: |
    - The open surface is product data only; the AER holds no consumer usage data and
      should never be credited with a consumer-data implementation.
    - No Australia-wide query exists; enumeration requires the ACCC register or the
      AER's published base URI document.
    - The harvested OpenAPI is the Data Standards Body's, not the AER's; the AER
      publishes no specification of its own.
    - Direct HTTP access to www.aer.gov.au was blocked for this probe host, so all
      aer.gov.au statuses are indirect.

