not_asserted:
  detail: >-
    The AER publishes no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP certification and
    operates no trust centre — expected for an Australian Commonwealth regulator whose
    public API surface holds no personal data. Its assurance posture is statutory
    (Commonwealth PSPF/ISM obligations and the CDR regime), not commercial
    certification.
