method: searched
source: >-
  https://www.aer.gov.au/energy-product-reference-data +
  openapi/cdr-energy-api-openapi.json + openapi/cds-common-api-openapi.json + live
  probes on 2026-07-27
summary: >-
  The AER's conformance posture is unusual in the best way: it is not self-asserted.
  The contract it serves is authored by the Data Standards Body, binding under Part
  IVD of the Competition and Consumer Act 2010, and independently corroborated by the
  ACCC's own CDR Register, which resolves 79 of 84 energy data-holder brands to this
  host. Standards-shaped payloads AND standards-shaped errors were observed live.
standards:
- id: cdr-consumer-data-standards-energy
  name: Consumer Data Standards — CDR Energy API
  version: 1.36.0
  conforms: true
  evidence: >-
    Live 200 responses matching the CDS EnergyPlanListResponse and
    EnergyPlanResponseV3 shapes, CDS URN error codes on failure, CDS-mandated base
    path /{brand}/cds-au/v1/. The AER states it "continues to implement its Consumer
    Data Right solution in alignment with the Consumer Data Standards".
  scope: Get Generic Plans (x-v 1) and Get Generic Plan Detail (x-v 3) only.
  source: https://consumerdatastandardsaustralia.github.io/standards/
- id: cdr-consumer-data-standards-common
  name: Consumer Data Standards — CDR Common API (discovery)
  version: 1.36.0
  conforms: true
  evidence: >-
    GET /discovery/status returned 200 with data.status OK; GET /discovery/outages
    returned 200 with data.outages []. Both at x-v 1, both anonymous.
- id: cdr-rules-2020
  name: Competition and Consumer (Consumer Data Right) Rules 2020
  conforms: true
  evidence: >-
    "The AER is a designated data holder under Competition and Consumer (Consumer Data
    Right) Rules 2020" — published on the AER's own Energy Product Reference Data
    page. Corroborated by the ACCC CDR Register.
  regulator: ACCC
  register: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
- id: cds-non-functional-requirements
  name: CDS Non-Functional Requirements (availability, performance, traffic thresholds)
  conforms: true
  evidence: >-
    The AER's own FAQ answers "What is the rate limit for APIs?" by pointing at the
    CDR Non-Functional Requirements, adopting them as its own obligation. Captured in
    rate-limits/aer-rate-limits.yml
- id: openapi-3
  name: OpenAPI 3.0.3
  conforms: true
  evidence: >-
    The contract is published as OpenAPI 3.0.3 by the Data Standards Body. NOTE — this
    specification is authored by the DSB, not by the AER; the AER publishes no
    OpenAPI of its own (/openapi.json and /swagger.json return 404 on both hosts).
- id: fapi
  name: FAPI (Financial-grade API) — correlation header only
  conforms: partial
  evidence: >-
    x-fapi-interaction-id is returned on every response. The full FAPI 1.0 Advanced
    security profile applies to the authenticated CDR surface, which the AER does not
    operate.
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: >-
    Not applicable. The AER's endpoints are unauthenticated by design under the CDS;
    no securitySchemes appear on the operations it serves and
    /.well-known/oauth-authorization-server returns 404.
- id: openid-connect
  name: OpenID Connect
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on all three AER hosts.
