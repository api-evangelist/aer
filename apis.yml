- aid: aer:aer-energy-product-reference-data-get-generic-plan-detail
  name: AER Energy Product Reference Data - Get Generic Plan Detail
  description: Anonymous, unaccredited Consumer Data Right energy Product Reference
    Data endpoint operated by the AER. Returns the full detail of a single current,
    generally available retail energy plan by plan identifier — tariff structures,
    metering charges, contract terms, incentives, discounts, fees, solar feed-in and
    eligibility. Version 3 is the supported version; version 2 was retired on 3 March
    2025 and requests with x-v other than 3 return 406. Verified 2026-07-27 with
    GET https://cdr.energymadeeasy.gov.au/agl/cds-au/v1/energy/plans/AGL1067320MRE2@EME
    and header x-v 3, HTTP 200.
  humanURL: https://www.aer.gov.au/energy-product-reference-data
