- aid: aer:aer-cdr-discovery-status-and-outages
  name: AER CDR Discovery - Get Status and Get Outages
  description: Anonymous Consumer Data Standards Common API discovery endpoints served
    by the AER on its CDR host. GET /discovery/status returns the current operational
    status of the data holder's CDR endpoints and GET /discovery/outages returns
    scheduled and current outages. Verified 2026-07-27 - status returned HTTP 200 with
    data.status OK and an updateTime, outages returned HTTP 200 with an empty outages
    array, both with header x-v 1 (x-v 2 returns 406). This is the AER's status page -
    there is no HTML status site - and it is the correct surface to poll before raising
    a support ticket against the product reference data endpoints. Both endpoints are
    brand-scoped and must be called under a retailer path segment; the unbranded
    /cds-au/v1/discovery/status returns 404. Observed quirk - the outages response
    links.self echoed a different brand path than the one requested.
  humanURL: https://www.aer.gov.au/energy-product-reference-data
