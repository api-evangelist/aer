apis:
- aid: aer:aer-energy-product-reference-data-get-generic-plans
  name: AER Energy Product Reference Data - Get Generic Plans
  description: Anonymous, unaccredited Consumer Data Right energy Product Reference
    Data endpoint operated by the AER. Returns a paged summary of all current,
    generally available retail energy plans for one retailer brand, covering plan
    name, fuel type, brand, distributor and postcode geography, plan type and
    effective dates. The retailer brand is a path segment taken from the AER's
    published list of CDR energy base URIs — for example
    https://cdr.energymadeeasy.gov.au/agl/cds-au/v1/energy/plans?type=ALL, which
    returned HTTP 200 with 1,343 AGL plans on 2026-07-27. Requires the x-v request
    header; only version 1 is supported and any other value returns 406. Default page
    size is 25, maximum 1000. There is no Australia-wide call — one request per
    retailer brand.
  humanURL: https://www.aer.gov.au/energy-product-reference-data
  baseURL: https://cdr.energymadeeasy.gov.au/agl/cds-au/v1
